[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mirrorlab"
version = "0.1.0"
description = "MIRRORLAB: The Missing Scratch - A synthetic visual-task factory for machine-vision geometric optics reasoning in VLMs"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MIRRORLAB Team", email = "team@mirrorlab.ai" }
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26.0",
    "shapely>=2.0.0",
    "pillow>=10.2.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "plotly>=5.19.0",
    "streamlit>=1.32.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
mirrorlab = "mirrorlab.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
