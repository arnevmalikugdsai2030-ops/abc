# Default Benchmark Generation & Evaluation Configuration

geometry:
  canvas_width: 1000.0
  canvas_height: 1000.0
  camera_fov_degrees: 60.0
  camera_range_max: 1200.0
  mirror_length_min: 120.0
  mirror_length_max: 240.0
  ray_clearance_epsilon: 10.0  # Min clearance in mm from obstacles to prevent pixel ambiguity

generation:
  default_sample_count: 100
  random_seed: 42
  balance_classes: true
  task_types:
    - TASK_A_VISIBILITY
    - TASK_B_OBSTRUCTION
    - TASK_C_REPAIR
    - TASK_D_COUNTERFACTUAL
    - TASK_E_COSMETIC

rendering:
  image_size: [1024, 1024]
  themes:
    - industrial_clean
    - blueprint
    - dark_cad
    - sensor_noise

evaluation:
  default_model: "gemini-2.5-flash"
  temperature: 0.0
  max_retries: 3
